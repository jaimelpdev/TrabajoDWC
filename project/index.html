<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1dle</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="principal">
    <h1>
      <img class="logo" src="../imgs/logo.webp" alt="Logo" />
      F1dle
      <img class="logo" src="../imgs/logo.webp" alt="Logo" />
    </h1>
    <div id="game-container">
      <p>Guess the Formula 1 driver:</p>
      <input type="text" id="guess-input" placeholder="Introduce your answer..." />
      <button id="submit-guess">Guess</button>
      <p id="messageDiv"></p>
      <div id="feedback"></div>
    </div>
    <div id="point-store">
      <h2>Point Store</h2>
      <p>You have <span id="points">0</span> points.</p>
      <button id="buy-item-1">Buy Item 1 (10 points)</button>
      <button id="buy-item-2">Buy Item 2 (20 points)</button>
      <button id="buy-item-3">Buy Item 3 (30 points)</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
