<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1dle</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="icon" href="../imgs/logo.webp" type="image/x-icon">
</head>

<body>
  <div id="principal">
    <h1>
      <img class="icon" src="../imgs/logo.webp" alt="icon" />
      F1dle
      <img class="icon" src="../imgs/logo.webp" alt="icon" />
    </h1>
    <div id="game-container">
      <p>Guess the Formula 1 driver:</p>
      <input type="text" id="guess-input" placeholder="Introduce your anwser..." autocomplete="off"/>
      <button id="submit-guess">Guess</button>
      <p id="messageDiv"></p>
      <div id="feedback"></div>
    </div>
  </div>
  <div id="point-store">
    <h2>Point Store</h2>
    <p>You have <span id="points">0</span> points.</p>
    <i class="icon fa-solid fa-1"></i>
    <button id="button1" data-cost="10">Buy Extra Attempt (10 points)</button>
    <i class="icon fa-solid fa-3"></i>
    <button id="button2" data-cost="30">Buy 3 Extra Attempts (30 points)</button>
  </div>
  <script src="script.js"></script>
  <script src="https://kit.fontawesome.com/30514317fc.js" crossorigin="anonymous"></script>
</body>

</html>
