<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1dle</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="principal">
    <h1>
      <img class="icon" src="../imgs/icon.webp" alt="icon" />
      F1dle
      <img class="icon" src="../imgs/icon.webp" alt="icon" />
    </h1>
    <div id="game-container">
      <p>Guess the Formula 1 driver:</p>
      <input type="text" id="guess-input" placeholder="Introduce your answer..." />
      <button id="submit-guess">Guess</button>
      <p id="messageDiv"></p>
      <div id="feedback"></div>
    </div>
  </div>
  <div id="point-store">
    <h2>Point Store</h2>
    <p>You have <span id="points">0</span> points.</p>
    <button id="buy-hint-team" data-cost="10">Buy a Hint To Appear When Start (10 points)</button>
    <button id="buy-extra-attempt" data-cost="20">Buy Extra Attempt (20 points)</button>
    <button id="buy-skip" data-cost="50">Buy 3 Extra Attempts (50 points)</button>
  </div>
  <script src="script.js"></script>
</body>

</html>
